[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flet-storage"
version = "1.1.3"
authors = [
    { name = "Andrii Bogdanovych", email = "a@bogdanovych.org" }
]
description = "A lightweight utility for simplified client-side storage management in Flet applications."
readme = "README.md"
license = {text = "MIT"}
keywords = ["flet", "storage", "asyncio", "json-serialization", "python-flet", "shared-preferences"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "flet>=0.80.0",
]
[dependency-groups]
dev = [
    "flet-cli",
    "flet-desktop",
    "flet-web",
    "pre_commit",
    "ruff",
    "twine",
    "pytest",
    "pytest-asyncio",
]

[project.urls]
"Homepage" = "https://www.bogdanovych.org/en"
"Repository" = "https://github.com/BogdanovychA/flet-storage"
"DOI" = "https://doi.org/10.5281/zenodo.19492703"
"Bug Tracker" = "https://github.com/BogdanovychA/flet-storage/issues"
"AI Agent Skill" = "https://skills.sh/bogdanovycha/flet-storage/flet-storage"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
